services:

  mysql:
    image: mysql:8.0
    container_name: codebase_mysql
    environment:
      MYSQL_ROOT_PASSWORD: nandy123
      MYSQL_DATABASE: codebase_index
    ports:
       - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

  qdrant:
    image: qdrant/qdrant
    container_name: codebase_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  mysql_data:
  qdrant_data: